name: 'Build TTF'

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'src/svg/**'

jobs:
  build-ttf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

      - name: Install fantasticon
        run: npm install -g fantasticon

      - name: Get version
        id: version
        run: echo "value=$(cat upstream-version | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Generate TTF
        run: |
          mkdir -p ttf-output
          fantasticon src/svg \
            --name ionicons \
            --output ttf-output \
            --font-types ttf \
            --asset-types json \
            --font-height 512 \
            --normalize
          mv ttf-output/ionicons.ttf ttf-output/ionicons-${{ steps.version.outputs.value }}.ttf
          mv ttf-output/ionicons.json ttf-output/ionicons-${{ steps.version.outputs.value }}.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: ionicons TTF ${{ steps.version.outputs.value }}
          files: |
            ttf-output/ionicons-${{ steps.version.outputs.value }}.ttf
            ttf-output/ionicons-${{ steps.version.outputs.value }}.json
